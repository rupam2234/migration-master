<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="460" fill="#faf9f7"/>

  <text x="350" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1f1f">Where a Shopify store's monthly cost actually goes</text>
  <text x="350" y="64" text-anchor="middle" font-size="13" fill="#6b6b6b">Each layer stacks on top of the plan price — none of it is optional at scale</text>

  <!-- Stack container -->
  <g transform="translate(150,95)">
    <!-- Base plan -->
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#2b2b2b"/>
    <text x="20" y="27" font-size="14" font-weight="700" fill="#ffffff">Base plan</text>
    <text x="20" y="46" font-size="12" fill="#d7d7d7">$39 – $399 / month</text>

    <!-- Transaction fees -->
    <rect x="0" y="66" width="220" height="60" rx="6" fill="#c2410c"/>
    <text x="20" y="93" font-size="14" font-weight="700" fill="#ffffff">Transaction fees</text>
    <text x="20" y="112" font-size="12" fill="#ffe4d1">0.5% – 2% of every sale</text>

    <!-- Apps -->
    <rect x="0" y="132" width="220" height="60" rx="6" fill="#ea580c"/>
    <text x="20" y="159" font-size="14" font-weight="700" fill="#ffffff">Apps</text>
    <text x="20" y="178" font-size="12" fill="#ffe4d1">$30 – $200 / month</text>

    <!-- Theme -->
    <rect x="0" y="198" width="220" height="60" rx="6" fill="#fb923c"/>
    <text x="20" y="225" font-size="14" font-weight="700" fill="#3a1c00">Theme + customization</text>
    <text x="20" y="244" font-size="12" fill="#5c2e00">$150 – $350 one-time</text>

    <!-- Plan upgrades -->
    <rect x="0" y="264" width="220" height="60" rx="6" fill="#fed7aa"/>
    <text x="20" y="291" font-size="14" font-weight="700" fill="#5c2e00">Plan upgrades</text>
    <text x="20" y="310" font-size="12" fill="#7c3f00">As you hit feature walls</text>
  </g>

  <!-- Arrow to total -->
  <path d="M 400 235 L 450 235" stroke="#9a9a9a" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <!-- Total box -->
  <g transform="translate(465,170)">
    <rect x="0" y="0" width="150" height="130" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#6b6b6b">TYPICAL ALL-IN</text>
    <text x="75" y="60" text-anchor="middle" font-size="24" font-weight="800" fill="#c2410c">$150–</text>
    <text x="75" y="86" text-anchor="middle" font-size="24" font-weight="800" fill="#c2410c">$400</text>
    <text x="75" y="110" text-anchor="middle" font-size="12" fill="#6b6b6b">per month</text>
  </g>

  <text x="350" y="435" text-anchor="middle" font-size="12" fill="#8a8a8a">Advertised plan price is the floor, not the total</text>
</svg>
